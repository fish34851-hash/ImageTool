<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ImageTool social preview</title>
  <desc id="description">A privacy-friendly browser image converter for batch conversion, resizing, and rotation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4e8"/>
      <stop offset="1" stop-color="#eef3e8"/>
    </linearGradient>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#e9e9e2"/>
      <rect width="12" height="12" fill="#d8d9d1"/>
      <rect x="12" y="12" width="12" height="12" fill="#d8d9d1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#294a34" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1100" cy="80" r="230" fill="#dfe9d8" opacity="0.56"/>
  <circle cx="95" cy="610" r="180" fill="#f2dfbe" opacity="0.55"/>

  <g transform="translate(72 62)">
    <rect width="58" height="58" rx="13" fill="#294a34"/>
    <text x="29" y="41" text-anchor="middle" fill="#fffdf7" font-family="Georgia, serif" font-size="36" font-style="italic" font-weight="700">I</text>
    <text x="78" y="40" fill="#18241c" font-family="Arial, sans-serif" font-size="31" font-weight="700">ImageTool</text>
  </g>

  <g transform="translate(72 192)">
    <text fill="#294a34" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4">BATCH · PRIVATE · FREE</text>
    <text y="80" fill="#142018" font-family="Georgia, serif" font-size="64" font-weight="700">Convert images.</text>
    <text y="150" fill="#486653" font-family="Georgia, serif" font-size="64" font-weight="700">Keep them private.</text>
    <text y="205" fill="#556158" font-family="Arial, sans-serif" font-size="22">Batch convert, resize and rotate — entirely in your browser.</text>
  </g>

  <g transform="translate(72 500)" font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <g><rect width="88" height="38" rx="19" fill="#fff" stroke="#cbd5ca"/><text x="44" y="25" text-anchor="middle" fill="#294a34">PNG</text></g>
    <g transform="translate(100)"><rect width="88" height="38" rx="19" fill="#fff" stroke="#cbd5ca"/><text x="44" y="25" text-anchor="middle" fill="#294a34">JPG</text></g>
    <g transform="translate(200)"><rect width="88" height="38" rx="19" fill="#fff" stroke="#cbd5ca"/><text x="44" y="25" text-anchor="middle" fill="#294a34">WebP</text></g>
    <g transform="translate(306)"><rect width="150" height="38" rx="19" fill="#294a34"/><text x="75" y="25" text-anchor="middle" fill="#fff">Offline ready</text></g>
  </g>

  <g transform="translate(755 112)" filter="url(#shadow)">
    <rect width="375" height="406" rx="30" fill="#fffdf8"/>
    <rect x="24" y="24" width="327" height="250" rx="20" fill="url(#checker)"/>
    <g transform="translate(75 72)">
      <rect width="210" height="155" rx="12" fill="#6f9478"/>
      <circle cx="167" cy="42" r="23" fill="#f4d79c"/>
      <path d="M16 139l62-72 43 48 27-31 46 55z" fill="#dbe8d8"/>
      <path d="M16 139l62-72 24 27-38 45z" fill="#f3eee0"/>
    </g>
    <g transform="translate(38 307)" font-family="Arial, sans-serif">
      <circle cx="22" cy="22" r="22" fill="#294a34"/>
      <path d="M13 21a10 10 0 1 1 3 8M13 21v-7m0 7h7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="18" fill="#253128" font-size="16" font-weight="700">100% local processing</text>
      <text x="58" y="39" fill="#738076" font-size="13">Your images never leave your device</text>
    </g>
  </g>

  <text x="1128" y="586" text-anchor="end" fill="#53665a" font-family="Arial, sans-serif" font-size="16" font-weight="700">fish34851-hash.github.io/ImageTool</text>
</svg>
